name: Setup Ubuntu CI Tools
description: Set up the latest Yosys build and additional native-runner packages needed by tracker workflows

inputs:
  packages:
    description: 'Space-separated apt packages to install (excluding Yosys)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install latest Yosys
      uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4.1.0
      with:
        github-token: ${{ github.token }}

    - name: Install apt packages
      if: ${{ inputs.packages != '' }}
      shell: bash
      run: |
        read -r -a packages <<< "${{ inputs.packages }}"
        sudo apt-get update
        sudo apt-get install -y "${packages[@]}"
