[package]
name = "circt-synth-server-rs"
version = "0.1.0"
edition = "2021"
description = "Production-quality HTTP front end for circt-synth-server: pooling, timeouts, fingerprint cache, JSONL admit log"

[[bin]]
name = "circt-synth-server-rs"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
